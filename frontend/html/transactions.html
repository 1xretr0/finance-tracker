<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions — Finance Tracker</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/transactions.css">
</head>
<body>
    <header>
        <h1>Finance Tracker</h1>
        <nav>
            <a href="/">Overview</a>
            <a href="/categorize">Categorize</a>
            <a href="/transactions" class="active" aria-current="page">Transactions</a>
            <span class="header-user" id="logged-user"></span>
            <button class="btn-logout" title="Log out">Log out</button>
        </nav>
    </header>

    <main>
        <div class="transactions-header">
            <h2>Transaction Details</h2>
            <div class="month-nav">
                <button class="month-nav-btn" id="month-prev" aria-label="Previous month">&#9664;</button>
                <input type="month" id="transactions-month">
                <button class="month-nav-btn" id="month-next" aria-label="Next month">&#9654;</button>
            </div>
        </div>

        <div class="tables-grid">
            <section class="table-section" id="income-section">
                <div class="table-section-header">
                    <h3>Income</h3>
                    <div class="table-section-actions">
                        <button class="btn-new-tx" data-type="income">+ New</button>
                        <button class="btn-edit-table" data-table="income">Edit</button>
                        <div class="sort-wrapper">
                            <button class="btn-sort-table" id="income-sort-btn" aria-haspopup="true" aria-expanded="false">Sort</button>
                            <div class="sort-menu" id="income-sort-menu" hidden>
                                <button class="sort-option" data-field="date">Date</button>
                                <button class="sort-option" data-field="amount">Amount</button>
                                <button class="sort-option" data-field="source">Source</button>
                                <button class="sort-option" data-field="category">Category</button>
                            </div>
                        </div>
                    </div>
                </div>
                <table id="income-table">
                    <thead>
                        <tr>
                            <th class="col-selector"></th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Source</th>
                            <th>Category</th>
                            <th class="col-actions"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>

            <section class="table-section" id="expense-section">
                <div class="table-section-header">
                    <h3>Expenses</h3>
                    <div class="table-section-actions">
                        <button class="btn-new-tx" data-type="expense">+ New</button>
                        <button class="btn-edit-table" data-table="expense">Edit</button>
                        <div class="filter-wrapper">
                            <button class="btn-filter-table" id="expense-filter-btn" aria-haspopup="true" aria-expanded="false">Filter</button>
                            <div class="filter-menu" id="expense-filter-menu" hidden>
                                <div class="filter-fields">
                                    <button class="filter-option" data-field="date">Date</button>
                                    <button class="filter-option" data-field="amount">Amount</button>
                                    <button class="filter-option" data-field="description">Description</button>
                                    <button class="filter-option" data-field="category">Category</button>
                                </div>
                                <input type="text" class="filter-input" id="expense-filter-input" placeholder="Select a column first" disabled>
                                <button class="filter-clear" id="expense-filter-clear">Clear filter</button>
                            </div>
                        </div>
                    </div>
                </div>
                <table id="expense-table">
                    <thead>
                        <tr>
                            <th class="col-selector"></th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th class="col-actions"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/transactions.js"></script>
</body>
</html>
