<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <header>
        <h1>Finance Tracker</h1>
		<nav>
            <a href="/" class="active" aria-current="page">Overview</a>
            <a href="/categorize">Categorize</a>
            <a href="/transactions">Transactions</a>
            <a href="/settings">Settings</a>
            <span class="header-user" id="logged-user"></span>
            <button class="btn-logout" title="Log out">Log out</button>
        </nav>
    </header>

    <main>
        <div class="page-toolbar">
            <h2 class="page-toolbar-title" id="selected-month-label"></h2>
            <div class="month-nav">
                <button class="month-nav-btn" id="ov-month-prev" aria-label="Previous month">&#9664;</button>
                <input type="month" id="ov-month">
                <button class="month-nav-btn" id="ov-month-next" aria-label="Next month">&#9654;</button>
            </div>
        </div>

        <section class="kpi-section">
            <div class="kpi-row" id="kpi-row"></div>
        </section>

        <section class="chart-section">
            <div class="chart-header">
                <h2>Cash Flow</h2>
            </div>
            <div class="cashflow-grid">
                <div class="chart-canvas-wrapper">
                    <canvas id="cashflow-chart"></canvas>
                </div>
                <div class="chart-canvas-wrapper">
                    <h3 class="chart-subtitle">Net balance (cumulative)</h3>
                    <canvas id="savings-chart"></canvas>
                </div>
            </div>
        </section>

        <section class="breakdown-section">
            <div class="breakdown-header">
                <h2>Monthly Breakdown</h2>
            </div>
            <div class="breakdown-empty" id="breakdown-empty" hidden></div>
            <div class="breakdown-charts" id="breakdown-charts">
                <div class="breakdown-chart-container">
                    <h3>Income</h3>
                    <div class="breakdown-chart-wrapper">
                        <canvas id="income-chart"></canvas>
                        <div class="breakdown-total" id="income-total"></div>
                    </div>
                </div>
                <div class="breakdown-chart-container">
                    <h3>Expenses</h3>
                    <div class="breakdown-chart-wrapper">
                        <canvas id="expense-chart"></canvas>
                        <div class="breakdown-total" id="expense-total"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="budgets-section">
            <div class="section-header">
                <h2>Budgets</h2>
            </div>
            <div class="budgets-list" id="budgets-list"></div>
        </section>

        <section class="insights-grid">
            <div class="insight-panel" id="merchants-panel">
                <div class="section-header">
                    <h2>Top Merchants</h2>
                </div>
                <div class="list-panel" id="merchants-list"></div>
            </div>
            <div class="insight-panel" id="recurring-panel">
                <div class="section-header">
                    <h2>Recurring</h2>
                    <span class="section-header-sub" id="recurring-total"></span>
                </div>
                <div class="list-panel" id="recurring-list"></div>
            </div>
        </section>

        <section class="summary-section">
            <div class="summary-grid">
                <div class="summary-card" id="quarter-summary"></div>
                <div class="summary-card" id="ytd-summary"></div>
            </div>
        </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
