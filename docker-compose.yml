services:
  app:
    build: .
    env_file: .env
    # These win over env_file, so a local-run .env can't break the container.
    environment:
      - DATA_DIR=/data
      - OAUTH_BIND_ADDR=0.0.0.0
      - PORT=5000
    # Loopback only: put an HTTPS reverse proxy in front. To reach it from
    # other machines on purpose, change this to "5000:5000".
    ports:
      - "127.0.0.1:5000:5000"
    # Linux: run `mkdir -p data && sudo chown 1000:1000 data` before the first
    # `docker compose up`, or Docker creates ./data root-owned and the app can't write to it.
    volumes:
      - ./data:/data
    restart: unless-stopped
